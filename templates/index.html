<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sikkim Monastery Guide</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to bottom, #fff7e6, #f9fafc);
            font-family: "Segoe UI", sans-serif;
        }
        .header {
            text-align: center;
            padding: 20px;
            background: #a83232;
            color: white;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 2rem;
        }
        .monastery-card {
            border-radius: 12px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.15);
            padding: 16px;
            margin: 12px 0;
            background: #fffdf6;
            border-left: 6px solid #e6b800;
            transition: all 0.4s ease;
        }
        .monastery-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #a83232;
        }
        .detected {
            padding: 15px;
            background: #fceabb;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #e6b800;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            margin-top: 8px;
        }
        .flag-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .flag {
            width: 40px;
            height: 20px;
            border-radius: 4px;
        }
        .red { background: #e63946; }
        .blue { background: #457b9d; }
        .green { background: #2a9d8f; }
        .yellow { background: #f4a261; }
        .white { background: #f1faee; border: 1px solid #ccc; }

        /* Highlight detected monastery */
        .highlight {
            border: 3px solid #ffcc00 !important;
            box-shadow: 0 0 15px #ffd633;
            transform: scale(1.02);
        }

        /* Pulse animation */
        @keyframes pulse {
            0%   { box-shadow: 0 0 10px #ffd633; }
            50%  { box-shadow: 0 0 25px #ffcc00; }
            100% { box-shadow: 0 0 10px #ffd633; }
        }
        .pulse {
            animation: pulse 1s ease-in-out 3;
        }

        /* Progress bar */
        .progress-container {
            margin-top: 8px;
        }
        .progress {
            height: 10px;
            cursor: pointer;
        }
        .progress-bar {
            background: #a83232;
        }
        .progress-text {
            font-size: 0.9rem;
            margin-top: 4px;
            text-align: right;
            color: #333;
        }
        .now-playing {
            font-weight: bold;
            color: #a83232;
            margin-top: 6px;
        }
    </style>
</head>
<body>
<div class="container mt-4">

    <!-- Header -->
    <div class="header">
        <h1>🕉️ Sikkim Monastery Guide</h1>
        <p>Explore sacred monasteries of Sikkim with GPS + Bluetooth Beacon smart audio guides.</p>
    </div>

    <!-- Prayer Flag Bar -->
    <div class="flag-bar">
        <div class="flag red"></div>
        <div class="flag blue"></div>
        <div class="flag green"></div>
        <div class="flag yellow"></div>
        <div class="flag white"></div>
    </div>

    <!-- Auto-Detected Location -->
    <h4>📡 Auto-Detected Location</h4>
    <div id="detected-monastery" class="detected">Detecting...</div>
    <audio id="auto-audio" controls hidden></audio>
    <div id="auto-progress-container" class="progress-container" style="display:none;">
        <div class="progress" id="auto-progress">
            <div id="auto-progress-bar" class="progress-bar" role="progressbar" style="width: 0%;"></div>
        </div>
        <div id="auto-progress-text" class="progress-text"></div>
    </div>

    <!-- Monastery List -->
    <div id="monastery-list"></div>

</div>

<script>
    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s.toString().padStart(2,"0")}`;
    }

    function attachProgress(audioEl, progressDiv, progressBar, progressText) {
        let isDragging = false;

        audioEl.addEventListener("timeupdate", () => {
            if (!isDragging && audioEl.duration > 0) {
                const percent = (audioEl.currentTime / audioEl.duration) * 100;
                progressBar.style.width = percent + "%";
                progressText.textContent = `${formatTime(audioEl.currentTime)} / ${formatTime(audioEl.duration)}`;
            }
        });

        function seek(e) {
            const rect = progressDiv.getBoundingClientRect();
            const offsetX = e.clientX - rect.left;
            const percent = Math.max(0, Math.min(1, offsetX / rect.width));
            audioEl.currentTime = percent * audioEl.duration;
        }

        progressDiv.addEventListener("mousedown", (e) => {
            isDragging = true;
            seek(e);
        });

        document.addEventListener("mousemove", (e) => {
            if (isDragging) seek(e);
        });

        document.addEventListener("mouseup", () => {
            if (isDragging) isDragging = false;
        });
    }

    async function loadMonasteries() {
        const res = await fetch("/api/monasteries");
        const data = await res.json();
        const container = document.getElementById("monastery-list");

        Object.keys(data).forEach(name => {
            const m = data[name];
            const card = document.createElement("div");
            card.className = "monastery-card";
            card.id = name.replace(/\s+/g, '-');

            card.innerHTML = `
                <div class="monastery-title">${name}</div>
                <p>📍 Location: ${m.location}</p>
                <p>📅 Founded: ${m.year}</p>
                <audio controls>
                    <source src="/audio/${m.audio}" type="audio/mpeg">
                </audio>
                <div class="now-playing" style="display:none;">🎧 Now Playing Audio Guide</div>
                <div class="progress-container" style="display:none;">
                    <div class="progress">
                        <div class="progress-bar" role="progressbar" style="width:0%;"></div>
                    </div>
                    <div class="progress-text"></div>
                </div>
            `;

            const audioEl = card.querySelector("audio");
            const progressContainer = card.querySelector(".progress-container");
            const progressBar = card.querySelector(".progress-bar");
            const progressText = card.querySelector(".progress-text");
            const progressDiv = card.querySelector(".progress");

            audioEl.addEventListener("play", () => {
                progressContainer.style.display = "block";
                card.querySelector(".now-playing").style.display = "block";
            });

            audioEl.addEventListener("ended", () => {
                progressContainer.style.display = "none";
                card.querySelector(".now-playing").style.display = "none";
            });

            attachProgress(audioEl, progressDiv, progressBar, progressText);
            container.appendChild(card);
        });
    }

    async function checkDetectedMonastery() {
        try {
            const res = await fetch("/api/detected");
            const data = await res.json();

            const detectedDiv = document.getElementById("detected-monastery");
            const autoAudio = document.getElementById("auto-audio");
            const autoProgressContainer = document.getElementById("auto-progress-container");
            const autoProgressBar = document.getElementById("auto-progress-bar");
            const autoProgressText = document.getElementById("auto-progress-text");
            const autoProgressDiv = document.getElementById("auto-progress");

            document.querySelectorAll(".monastery-card").forEach(c => {
                c.classList.remove("highlight", "pulse");
                c.querySelector(".now-playing").style.display = "none";
                c.querySelector(".progress-container").style.display = "none";
            });

            if (data.name) {
                detectedDiv.innerHTML = `🎉 You are at <b>${data.name}</b>!`;
                autoAudio.src = `/audio/${data.audio}`;
                autoAudio.hidden = false;

                autoAudio.play().catch(err => console.log("Autoplay blocked:", err));

                autoProgressContainer.style.display = "block";
                attachProgress(autoAudio, autoProgressDiv, autoProgressBar, autoProgressText);

                const card = document.getElementById(data.name.replace(/\s+/g, '-'));
                if (card) {
                    card.classList.add("highlight", "pulse");
                    card.scrollIntoView({ behavior: "smooth", block: "center" });
                    card.querySelector(".now-playing").style.display = "block";
                }

            } else {
                detectedDiv.innerHTML = "⚠️ No monastery detected nearby.";
                autoAudio.hidden = true;
                autoProgressContainer.style.display = "none";
            }
        } catch (err) {
            console.error("Detection error:", err);
        }
    }

    loadMonasteries();
    setInterval(checkDetectedMonastery, 15000);
    checkDetectedMonastery();
</script>
</body>
</html>
